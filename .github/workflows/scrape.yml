name: scrape

# Runs the Instagram scraper and commits data.json back to the repo.
#   - schedule: every 6 hours (don't go faster — Instagram blocks bursts)
#   - workflow_dispatch: the "Run workflow" button = your manual "refresh metrics"
#   - push on links.txt: adding a reel URL auto-triggers a scrape
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - links.txt

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install instaloader

      # Optional but recommended: log in so Instagram is less likely to block the datacenter IP.
      # Create the session locally once (`instaloader --login USER`), base64 it, and add two repo
      # secrets: IG_USERNAME and IG_SESSION (base64 of ~/.config/instaloader/session-USER).
      - name: Scrape
        env:
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_SESSION: ${{ secrets.IG_SESSION }}
        run: |
          if [ -n "$IG_SESSION" ] && [ -n "$IG_USERNAME" ]; then
            mkdir -p "$HOME/.config/instaloader"
            echo "$IG_SESSION" | base64 -d > "$HOME/.config/instaloader/session-$IG_USERNAME"
            python ig_scrape.py --links links.txt --out data.json --login "$IG_USERNAME" || true
          else
            echo "::warning::No IG_SESSION secret set — scraping anonymously from a datacenter IP, which Instagram often blocks. See README for the session-secret setup."
            python ig_scrape.py --links links.txt --out data.json || true
          fi

      - name: Commit data.json
        run: |
          git config user.name "reel-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh metrics [skip ci]"
            git push
          fi
