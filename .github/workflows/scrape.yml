name: scrape

# Reads public Instagram reel metrics (likes/comments/caption/owner) with a crawler user-agent —
# no login, no API key, standard library only. Commits data.json back to the repo.
#   - schedule: every 6 hours
#   - workflow_dispatch: the "Run workflow" button = your manual refresh
#   - push on links.txt: adding a reel auto-triggers a scrape
on:
  schedule:
    # every 5 min is the GitHub floor; scheduled runs are best-effort and can be delayed under load
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - links.txt

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape
        run: python ig_scrape.py --links links.txt --out data.json

      - name: Commit data.json
        run: |
          git config user.name "reel-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh metrics [skip ci]"
            git push
          fi
